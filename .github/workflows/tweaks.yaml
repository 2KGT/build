# version: 3.1.0 | 2026-11-15 | phát hành thành MỘT hàng đợi: Sileo .deb → Sileo .dylib → Release (mỗi bước chờ kho xử lý xong); publish.py chỉ chuyển hàng tới hộp nhận repo Sileo, việc phân loại/đặt kệ do repo Sileo làm
name: "Build Multi Tweaks vip"

# ┌─ BẢNG CẤU HÌNH (đúng thứ tự hiển thị trên GitHub) ───────────────────────────
# │ 1 Dự án (None = chưa chọn, sẽ dừng)      2 Nâng version
# │ 3 Hệ sinh thái — chọn nhiều cùng lúc, xếp A-Z: Dylib · Rootful · Rootless
# │     Rootless (mặc định BẬT)  → .deb iphoneos-arm64        Rootful (tắt) → .deb iphoneos-arm
# │     Dylib (tắt)              → .dylib lấy từ bản Rootful (tự build ngầm nếu Rootful tắt)
# │ 4 Phát hành releases   → GitHub Release trong repo Sileo (kèm .deb/.dylib + ghi chú)
# │ 5 Đẩy lên repo Sileo   → chép thẳng vào repo/debs, repo/dylibs + ghi chú + commit
# │ 6 Gửi file qua Telegram (cả .deb lẫn .dylib)
# │ 7 make clean   8-10 Dọn dẹp (chỉ chạy tay)
# │ 11 Release notes + Commit changes — dùng chung cho Release, commit repo Sileo, Telegram
# │     và mô tả trong .deb. Nhãn đầu dòng: feat: fix: imp: note: info: (ngăn dòng bằng ; hoặc \n).
# │     Để trống = tự lấy từ các commit mới của dự án.
# └─ Push file <Dự án>/control => tự build (Rootless), KHÔNG phát hành. Sửa code / xoá file không tự build.
on:
  workflow_dispatch:
    inputs:
      project:
        description: '1️⃣ Dự án (None = Dont run)'
        required: true
        type: choice
        default: 'None'
        options: [ 'None', AutoAC, BiliBili, Facebook, Liquid, Twitter ]
      ver_type:
        description: '2️⃣ Nâng version'
        type: choice
        default: 'Patch (Vá lỗi)'
        options: [ 'Patch (Vá lỗi)', 'Minor (Tính năng)', 'Major (Đại tu)', 'Giữ nguyên' ]

      eco_dylib:
        description: '3️⃣ Tweaking · Dylib'
        type: boolean
        default: false
      eco_rootful:
        description: '3️⃣ Tweaking · Rootful'
        type: boolean
        default: false
      eco_rootless:
        description: '3️⃣ Tweaking · Rootless'
        type: boolean
        default: true

      release:
        description: '4️⃣ Phát hành Releases'
        type: boolean
        default: false
      publish:
        description: '5️⃣ Phát hành repo Sileo'
        type: boolean
        default: false
      send_deb:
        description: '6️⃣ Gửi file đến bot Telegram'
        type: boolean
        default: true

      clean_build:
        description: '7️⃣ Dọn: sạch trước khi build'
        type: boolean
        default: true
      run_clean_theos:
        description: '8️⃣ Dọn: ghost submodule theos'
        type: boolean
        default: false
      run_clean_logs:
        description: '9️⃣ Dọn: commit + runs & cache'
        type: boolean
        default: false
      clean_delay_seconds:
        description: '🔟 Waiting time to clean (s)'
        type: number
        default: 90

      notes:
        description: '🔢 Release notes + Commit changes'
        required: false
        type: string

  push:
    paths:
      - '**/control'      # chỉ control: nâng version / ghi control = tín hiệu phát hành

env:
  TZ: "Asia/Ho_Chi_Minh"
  THEOS: ${{ github.workspace }}/theos_engine

# Xếp hàng thay vì chạy song song: tránh 2 lần build cùng rebase/push lên một nhánh
concurrency:
  group: tweaks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1 — PLAN: quyết định build dự án nào (nhẹ, chạy trên Ubuntu)
  # ════════════════════════════════════════════════════════════════
  plan:
    name: 🗺️ Lập kế hoạch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: 📥 Checkout nhẹ (chạy tay lấy 1 commit; push lấy lịch sử không kèm nội dung file)
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
          filter: blob:none

      - name: 🧭 Kiểm tra lựa chọn (hệ sinh thái, secret phát hành)
        if: github.event_name == 'workflow_dispatch'
        env:
          ECO_DYLIB: ${{ inputs.eco_dylib }}
          ECO_ROOTFUL: ${{ inputs.eco_rootful }}
          ECO_ROOTLESS: ${{ inputs.eco_rootless }}
          DO_RELEASE: ${{ inputs.release }}
          DO_PUBLISH: ${{ inputs.publish }}
          HAS_REPO_TOKEN: ${{ secrets.REPO_TOKEN != '' }}
        run: |
          if [ "$ECO_DYLIB" != "true" ] && [ "$ECO_ROOTFUL" != "true" ] && [ "$ECO_ROOTLESS" != "true" ]; then
            echo "::error::Chưa bật hệ sinh thái nào. Bật ít nhất một mục ở bước 3 (Dylib · Rootful · Rootless)."; exit 1
          fi
          if { [ "$DO_RELEASE" = "true" ] || [ "$DO_PUBLISH" = "true" ]; } && [ "$HAS_REPO_TOKEN" != "true" ]; then
            echo "::error::Phát hành / Đẩy lên repo Sileo cần secret REPO_TOKEN (PAT có quyền ghi vào repo Sileo)."; exit 1
          fi
          if [ "$DO_RELEASE" = "true" ] && [ "$DO_PUBLISH" = "true" ]; then
            echo "::notice::Bật CẢ Đẩy lên repo Sileo và Phát hành releases: chạy theo hàng đợi Sileo .deb → Sileo .dylib → Release, mỗi bước chờ repo Sileo xử lý xong (thường 1-3 phút/bước). Cùng một tệp nằm ở hai nơi; thường chỉ cần bật MỘT."
          fi
          echo "✅ Lựa chọn hợp lệ — Dylib=$ECO_DYLIB Rootful=$ECO_ROOTFUL Rootless=$ECO_ROOTLESS Release=$DO_RELEASE Sileo=$DO_PUBLISH"

      - name: 🗺️ Xác định dự án cần build (plan.py)
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PROJECT: ${{ github.event.inputs.project }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/plan.py

      - name: 📢 Báo Telegram khi không lập được kế hoạch
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          JOB_STATUS: failure
          PROJECT_NAME: ${{ github.event.inputs.project || 'Unknown' }}
          SEND_DEB: 'false'
        run: |
          pip3 install requests --break-system-packages
          python3 .github/scripts/tgbot.py || true

  # ════════════════════════════════════════════════════════════════
  # JOB 1b — HOOKCHECK: chạy SONG SONG với forge, không chặn build
  #   • Hook hỏng và chưa có PR chờ duyệt → tự gọi Hook-Fix (mở PR để bạn duyệt)
  #   • Đã có PR → chỉ nhắc, không tạo thêm
  # ════════════════════════════════════════════════════════════════
  hookcheck:
    name: 🪝 Kiểm tra hook
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true      # công cụ cảnh báo, không làm đỏ workflow
    permissions:
      contents: read
      pull-requests: read
      actions: write             # để gọi Hook-Fix.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Checkout (đủ lịch sử để dựng fingerprint, không kèm nội dung file cũ)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: 🪝 Đối chiếu hook với header đã dump
        id: check
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python3 .github/scripts/hooks.py check-all --matrix "$MATRIX"

      - name: 🔧 Gọi Hook-Fix cho dump có hook hỏng (nếu chưa có PR chờ duyệt)
        if: steps.check.outputs.broken != '' && steps.check.outputs.broken != '0'
        env:
          BROKEN_DUMPS: ${{ steps.check.outputs.broken_dumps }}
        run: |
          # Không gọi lại khi đang chạy trên nhánh sửa hook (tránh vòng lặp PR chồng PR)
          case "$GITHUB_REF_NAME" in hookfix/*) echo "ℹ️ Đang ở nhánh $GITHUB_REF_NAME — không gọi Hook-Fix lại."; exit 0 ;; esac
          OPEN=$(gh pr list --state open --json headRefName --jq '.[].headRefName' || true)
          IFS=',' read -ra DUMPS <<< "$BROKEN_DUMPS"
          for d in "${DUMPS[@]}"; do
            if printf '%s\n' "$OPEN" | grep -q "^hookfix/${d}-"; then
              echo "⏳ $d: đã có PR sửa hook chờ duyệt."
              echo "- ⏳ \`$d\`: đã có PR sửa hook đang chờ bạn duyệt" >> "$GITHUB_STEP_SUMMARY"
            else
              gh workflow run Hook-Fix.yml --ref "$GITHUB_REF_NAME" -f dump="$d" -f dry_run=false \
                && echo "- 🔧 \`$d\`: đã gọi Hook-Fix, PR sẽ xuất hiện trong ít phút" >> "$GITHUB_STEP_SUMMARY" \
                || echo "::warning::Không gọi được Hook-Fix cho $d"
            fi
          done

  # ════════════════════════════════════════════════════════════════
  # JOB 2 — FORGE: build từng dự án (matrix, mỗi dự án một runner macOS)
  # ════════════════════════════════════════════════════════════════
  forge:
    name: 🔨 Build ${{ matrix.project }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false        # một dự án lỗi không làm dừng các dự án khác
      max-parallel: 2         # giới hạn số runner macOS chạy cùng lúc
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      INPUT_PROJECT: ${{ matrix.project }}   # build_engine.py đọc
      PROJECT_NAME: ${{ matrix.project }}    # tgbot.py đọc
    steps:

      # 1. Kiểm tra đầu vào và khởi tạo hệ thống
      - name: 📥 1.1 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ 1.4 Cài đặt Hệ thống Theos (Always run)
        run: |
          brew update
          brew install make ldid dpkg
          # Theos cần GNU make 4+; macOS chỉ có make 3.81 nên đưa gnubin lên đầu PATH
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: 🛠️ 1.5 Setup Theos Engine (Cache)
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-engine-${{ runner.os }}

      - name: ⌛️ 1.6 Clone Theos (cache miss)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz --strip-components=1 -C $THEOS/sdks

      # 2. Tự động Biên Dịch (Build Engine)
      - name: 🧩 2.0 Chọn hệ sinh thái build
        id: eco
        env:
          EVENT: ${{ github.event_name }}
          ECO_DYLIB: ${{ inputs.eco_dylib }}
          ECO_ROOTFUL: ${{ inputs.eco_rootful }}
          ECO_ROOTLESS: ${{ inputs.eco_rootless }}
        run: |
          LIST=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$ECO_DYLIB" = "true" ] && LIST="$LIST,dylib"
            [ "$ECO_ROOTFUL" = "true" ] && LIST="$LIST,rootful"
            [ "$ECO_ROOTLESS" = "true" ] && LIST="$LIST,rootless"
            LIST="${LIST#,}"
          else
            LIST="rootless"      # push control: mặc định Rootless
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "🧩 Hệ sinh thái: $LIST"

      - name: 🚎 2.1 Tự động Biên Dịch (Build Engine)
        id: python_build
        env:
          INPUT_VER_TYPE: ${{ github.event.inputs.ver_type }}
          INPUT_CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'true' }}
          INPUT_ECO: ${{ steps.eco.outputs.list }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          export THEOS=${{ env.THEOS }}
          python3 -u .github/scripts/build_engine.py

      - name: 📝 2.2 Tổng kết & Phân tích lỗi
        if: always()
        run: |
          if [ "${{ steps.python_build.outcome }}" == "success" ]; then
            echo "## ✅ Build thành công: ${{ steps.python_build.outputs.display_name }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.python_build.outputs.bumped }}" == "true" ]; then
              echo "Phiên bản: **v${{ steps.python_build.outputs.old_ver }} → v${{ steps.python_build.outputs.final_ver }}**" >> $GITHUB_STEP_SUMMARY
            else
              echo "Phiên bản: **v${{ steps.python_build.outputs.final_ver }}** (giữ nguyên)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Build thất bại" >> $GITHUB_STEP_SUMMARY
            echo "### Phân tích lỗi nhanh:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            # Tự động trích xuất các dòng lỗi từ log build
            if [ -s .github/scripts/build.log ]; then
              grep -iE "error|fatal|warning|ld:|make:" .github/scripts/build.log | tail -n 20 >> $GITHUB_STEP_SUMMARY || true
            else
              echo "Không có log build (lỗi xảy ra trước khi biên dịch)." >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # 2.3 Lưu version mới, CHANGELOG.md và danh sách giấy phép của dự án lên repo (khi build thành công)
      - name: 🔖 2.3 Lưu version & nhật ký build vào repo
        if: success()
        env:
          PROJ: ${{ steps.python_build.outputs.display_name }}
          FINAL_VER: ${{ steps.python_build.outputs.final_ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in control CHANGELOG.md THIRD_PARTY_LICENSES.md; do
            git add -A -- "$PROJ/$f" 2>/dev/null || true
          done
          git commit -m "🔖 $PROJ v$FINAL_VER [skip ci]" || { echo "Không có thay đổi để commit."; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "⚠️ Push lần $i thất bại, thử lại..."; sleep 3
          done
          exit 1

      # 3. Lưu trữ Artifacts (để tải về từ GitHub)
      - name: 🧾 3.0 Lưu nhật ký build (chạy cả khi build lỗi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.project }}
          path: .github/scripts/build*.log
          if-no-files-found: ignore

      - name: 📦 3.1 Chuẩn bị artifact (một .deb mỗi dự án cho gói IPA)
        if: success()
        run: |
          # Build Multi & Ký IPA (repo:<Dự án>) lấy .deb từ artifact này: chỉ giữ MỘT .deb (ưu tiên Rootless)
          # để không tiêm trùng cùng một tweak. Bản Rootful/Dylib vẫn nằm trong Release / repo Sileo.
          mkdir -p artifact_debs
          shopt -s nullglob
          files=(output/*arm64*.deb)
          [ ${#files[@]} -gt 0 ] || files=(output/*.deb)
          [ ${#files[@]} -gt 0 ] && cp "${files[@]}" artifact_debs/ || true

      - name: 📦 3.2 Upload Artifacts (.deb)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tweak-release-${{ matrix.project }}
          path: artifact_debs/
          if-no-files-found: warn

      - name: 🧬 3.3 Upload Artifacts (.dylib)
        if: success() && steps.python_build.outputs.has_dylib == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib-${{ matrix.project }}
          path: output/*.dylib

      # HÀNG ĐỢI PHÁT HÀNH — một bước duy nhất, thứ tự cố định, mỗi bước chờ bước trước được kho xử lý xong:
      #   1. Sileo · .deb    gửi vào hộp nhận repo/inbox/ của repo Sileo → chờ kho nhận hàng + dựng index
      #   2. Sileo · .dylib  như trên
      #   3. Release         tạo GitHub Release (chỉ khi 1-2 đã xong; thất bại ở bước nào thì dừng, không gửi tiếp)
      # publish.py chỉ CHUYỂN hàng tới đúng địa chỉ. Phân loại, đặt tên, đặt kệ debs/dylibs, ghi chú, ghi sổ
      # là việc của repo Sileo (workflow Auto-sync-feather-sileo + intake.py).
      - name: 📬 4.1 Xếp hàng phát hành (Sileo .deb → Sileo .dylib → Release)
        id: pub
        if: ${{ !cancelled() && steps.python_build.outcome == 'success' && (inputs.publish == true || inputs.release == true) && (steps.python_build.outputs.has_deb == 'true' || steps.python_build.outputs.has_dylib == 'true') }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROJECT: ${{ steps.python_build.outputs.display_name }}
          FINAL_VER: ${{ steps.python_build.outputs.final_ver }}
          ECOSYSTEMS: ${{ steps.python_build.outputs.ecosystems }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_RELEASE: ${{ inputs.release }}
        run: python3 .github/scripts/publish.py queue

      - name: 📢 5.1 Gửi Thông Báo Trạng Thái Luồng
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          JOB_STATUS: ${{ job.status }}
          SEND_DEB: ${{ github.event.inputs.send_deb || 'true' }}
          RELEASE_URL: ${{ steps.pub.outputs.release_url }}
          SYNCED: ${{ steps.pub.outputs.synced }}
        run: |
          if [ -f "./.github/scripts/tgbot.py" ]; then
             # Sửa lỗi externally-managed-environment bằng cờ --break-system-packages
             pip3 install requests --break-system-packages
             python3 ./.github/scripts/tgbot.py
          fi

  # ════════════════════════════════════════════════════════════════
  # JOB 3 — CLEANUP: chờ cloud rồi dọn dẹp (chỉ khi bấm tay + có tick + mọi build thành công)
  # Telegram của giai đoạn này gửi bên trong clean.py → tgbot.notify_clean()
  # ════════════════════════════════════════════════════════════════
  cleanup:
    name: 🧹 Dọn dẹp
    needs: [plan, forge]
    if: >
      always() && github.event_name == 'workflow_dispatch' &&
      needs.forge.result == 'success' &&
      (inputs.run_clean_theos == true || inputs.run_clean_logs == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⏳ Chờ cloud xử lý xong trước khi dọn dẹp"
        env:
          DELAY: ${{ inputs.clean_delay_seconds }}
        run: |
          DELAY="${DELAY:-90}"
          echo "⏱️  Chờ ${DELAY}s để cloud hoàn tất xử lý dữ liệu..."
          for i in $(seq "$DELAY" -10 1); do
            echo "   ⏳ Còn ${i}s..."
            sleep 10
          done
          echo "✅ Bắt đầu dọn dẹp!"

      - name: "🧹🗑️ Dọn dẹp repo (clean.py)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_CLEAN_THEOS: ${{ inputs.run_clean_theos }}
          RUN_CLEAN_LOGS: ${{ inputs.run_clean_logs }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          pip3 install requests --break-system-packages
          python3 .github/scripts/clean.py
