name: 📦 Đóng gói (IPA · Cyan · TrollFools · DEB)

# ┌─ THAY THẾ main.yml + cyan_ts.yml + ipa.yml (+ _build_tweaks.yml) ────────────
# │ Mọi nguồn tweak → MỘT danh sách token → bể pool/ → (ký giả) → đầu ra
# │
# │ TOKEN trong ô "Tweak" (cách nhau bằng dấu cách hoặc phẩy):
# │   youpip, ytplus@5.2.1   tên trong .github/tweaks.catalog.json (build từ source / release)
# │   preset:youmod          bộ dựng sẵn (youmod, ytlite, ytlite-full)
# │   repo:YouMod            .deb mới nhất do tweaks.yml build (artifact tweak-release-<Dự án>)
# │   https://…/x.deb        link .deb / .dylib / .zip
# │   file:debs/x.deb        file nằm sẵn trong repo này
# │
# │ BẢNG CẤU HÌNH: 1 Tweak · 2 IPA nguồn · 3 Đầu ra · 4 Ký · 5 Phát hành
# │ Chạy thử không tốn macOS: bật "Chỉ xem kế hoạch" (job plan chạy trên Ubuntu, vài giây).
# └─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      tweaks:
        description: '🧩 Tweak (tên · preset:x · repo:Dự_án · link · file:đường_dẫn)'
        required: true
        default: ''
        type: string
      exclude:
        description: '➖ Bỏ khỏi danh sách (tên, cách nhau dấu cách)'
        required: false
        type: string

      ipa_url:
        description: '📱 Link IPA đã decrypt (chỉ khi xuất IPA)'
        required: false
        type: string
      app_name:
        description: '🏷️ Tên app (trống = giữ nguyên)'
        default: 'YouTube'
        required: false
        type: string
      bundle_id:
        description: '🆔 Bundle ID (trống = giữ nguyên)'
        default: 'com.google.ios.youtube'
        required: false
        type: string
      cyan_flags:
        description: '🚩 Cờ cyan (mặc định -uwe, tự thêm f)'
        default: '-uwe'
        required: false
        type: string

      out_ipa:
        description: '📲 Xuất IPA (cyan inject)'
        type: boolean
        default: true
      out_cyan:
        description: '🧬 Xuất .cyan'
        type: boolean
        default: false
      out_trollfools:
        description: '🪄 Xuất .zip TrollFools'
        type: boolean
        default: false
      out_deb:
        description: '📦 Xuất .zip chứa deb/dylib'
        type: boolean
        default: false

      sign:
        description: '✍️ Ký giả (ldid -S) mọi Mach-O'
        type: boolean
        default: false
      entitlements:
        description: '📜 Entitlements (file trong repo, tuỳ chọn)'
        required: false
        type: string

      release:
        description: '🚀 Tạo Release nháp'
        type: boolean
        default: true
      dry_run:
        description: '🔍 Chỉ xem kế hoạch (không build)'
        type: boolean
        default: false

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1 — PLAN (Ubuntu, offline): mở rộng token, kiểm tra, quyết định cần công cụ nào
  # ════════════════════════════════════════════════════════════════
  plan:
    name: 🗺️ Lập kế hoạch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      needs_theos: ${{ steps.plan.outputs.needs_theos }}
      needs_cyan: ${{ steps.plan.outputs.needs_cyan }}
      needs_ldid: ${{ steps.plan.outputs.needs_ldid }}
      needs_dpkg: ${{ steps.plan.outputs.needs_dpkg }}
    env:
      TOKENS: ${{ inputs.tweaks }}
      EXCLUDE: ${{ inputs.exclude }}
      IPA_URL: ${{ inputs.ipa_url != '' && 'set' || '' }}   # plan chỉ cần biết có hay chưa, không cần giá trị
      OUT_IPA: ${{ inputs.out_ipa }}
      OUT_CYAN: ${{ inputs.out_cyan }}
      OUT_TF: ${{ inputs.out_trollfools }}
      OUT_DEB: ${{ inputs.out_deb }}
      SIGN: ${{ inputs.sign }}
      ENTITLEMENTS: ${{ inputs.entitlements }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗺️ Mở rộng & kiểm tra (package_engine.py plan)
        id: plan
        run: python3 .github/scripts/package_engine.py plan

  # ════════════════════════════════════════════════════════════════
  # JOB 2 — PACKAGE (macOS): tải/build → ký → đầu ra → Release
  # ════════════════════════════════════════════════════════════════
  package:
    name: 🔨 Đóng gói
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write     # tạo Release
      actions: read       # repo:<Dự án> đọc artifact của tweaks.yml
    env:
      TOKENS: ${{ inputs.tweaks }}
      EXCLUDE: ${{ inputs.exclude }}
      IPA_URL: ${{ inputs.ipa_url }}
      APP_NAME: ${{ inputs.app_name }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      CYAN_FLAGS: ${{ inputs.cyan_flags }}
      OUT_IPA: ${{ inputs.out_ipa }}
      OUT_CYAN: ${{ inputs.out_cyan }}
      OUT_TF: ${{ inputs.out_trollfools }}
      OUT_DEB: ${{ inputs.out_deb }}
      SIGN: ${{ inputs.sign }}
      ENTITLEMENTS: ${{ inputs.entitlements }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🙈 Ẩn link IPA khỏi log
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: tweaks,exclude,app_name,bundle_id,cyan_flags,out_ipa,out_cyan,out_trollfools,out_deb,sign,entitlements,release,dry_run

      # ── Công cụ: chỉ cài thứ kế hoạch thật sự cần ──────────────────────
      - name: 🛠️ Cài make · ldid
        if: needs.plan.outputs.needs_ldid == 'true'
        run: |
          brew install make ldid
          # Theos cần GNU make 4+; macOS chỉ có 3.81 nên đưa gnubin lên đầu PATH
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: 🛠️ Cài dpkg
        if: needs.plan.outputs.needs_dpkg == 'true'
        run: brew install dpkg

      - name: 🛠️ Cài cyan (pyzule-rw)
        if: needs.plan.outputs.needs_cyan == 'true'
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      # ── Theos: chỉ khi có tweak build từ source ────────────────────────
      - name: 🧱 Lấy commit Theos
        if: needs.plan.outputs.needs_theos == 'true'
        run: echo "THEOS_COMMIT=$(git ls-remote https://github.com/theos/theos HEAD | awk '{print substr($1,1,7)}')" >> "$GITHUB_ENV"

      - name: 🧱 Cache Theos
        id: cache-theos
        if: needs.plan.outputs.needs_theos == 'true'
        uses: actions/cache@v5
        with:
          path: theos
          key: 18.6-SDK-${{ env.THEOS_COMMIT }}

      - name: 🧱 Setup Theos (cache miss)
        if: needs.plan.outputs.needs_theos == 'true' && steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/theos/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout --quiet
          mv *.sdk "${GITHUB_WORKSPACE}/theos/sdks"

      - name: 🧱 Hoàn tất môi trường Theos
        if: needs.plan.outputs.needs_theos == 'true'
        run: |
          echo "THEOS=${GITHUB_WORKSPACE}/theos" >> "$GITHUB_ENV"
          sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' "${GITHUB_WORKSPACE}/theos/bin/convert_xml_plist.sh" || true
          curl -fL --silent --show-error -o /usr/local/bin/tbd "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac"
          chmod +x /usr/local/bin/tbd

      # ── IPA nguồn ──────────────────────────────────────────────────────
      - name: 📱 Tải và kiểm tra IPA
        if: inputs.out_ipa
        run: |
          curl -fL --retry 3 --silent --show-error -o app.ipa "$IPA_URL"
          mime=$(file --mime-type -b app.ipa)
          if [[ "$mime" != "application/x-ios-app" && "$mime" != "application/zip" ]]; then
            echo "::error::Không phải IPA hợp lệ (phát hiện: $mime)."; exit 1
          fi
          unzip -tq app.ipa > /dev/null || { echo "::error::File IPA bị hỏng."; exit 1; }
          PLIST=$(unzip -Z1 app.ipa 'Payload/*.app/Info.plist' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          unzip -p app.ipa "$PLIST" > "$RUNNER_TEMP/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/Info.plist" 2>/dev/null \
             || /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_TEMP/Info.plist" 2>/dev/null || true)
          VER=$(printf '%s' "$VER" | tr -cd '[:alnum:]._-')
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "IPA_PATH=$GITHUB_WORKSPACE/app.ipa" >> "$GITHUB_ENV"
          echo "📱 App version: ${VER:-không rõ}"

      # ── Lõi: bể → ký → đầu ra ──────────────────────────────────────────
      - name: 🧺 Gom tweak vào bể (resolve)
        run: python3 .github/scripts/package_engine.py resolve

      - name: ✍️ Ký giả (ldid -S)
        if: inputs.sign
        run: python3 .github/scripts/package_engine.py sign

      - name: 🏭 Tạo đầu ra (make)
        run: python3 .github/scripts/package_engine.py make

      # ── Phát hành ──────────────────────────────────────────────────────
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.run_number }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: 🚀 Release nháp
        if: inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pkg-${{ github.run_number }}
          name: ${{ inputs.app_name || 'Tweaks' }} (${{ github.run_number }})
          files: dist/*
          draft: true

      - name: 🔗 Liên kết
        if: inputs.release
        run: |
          echo "::notice::Release nháp tại https://github.com/${{ github.repository }}/releases"
