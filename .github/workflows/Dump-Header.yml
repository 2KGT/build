name: Vạn Header Super

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link IPADecrypt'
        required: true
        type: string
      app_name:
        description: 'Folder lưu (VD: YouTubeHeader)'
        required: true
        default: 'YouTubeHeader'
        type: string
      target_classes:
        description: 'Nhặt Class (trống = all, cách nhau bằng dấu cách)'
        required: false
        type: string
      clean_warehouse:
        description: 'Dọn sạch cũ trước khi nhập mới'
        type: boolean
        default: false
      skip_filtering:
        description: 'Tắt bộ lọc rác (Giữ lại tất cả)'
        type: boolean
        default: false
      apply_patch:
        description: 'Fix @class Forward Declaration'
        type: boolean
        default: true

jobs:
  dump_process:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      IPA_URL: ${{ github.event.inputs.ipa_url }}
      APP_NAME: ${{ github.event.inputs.app_name }}
      TARGET_CLASSES: ${{ github.event.inputs.target_classes }}
      CLEAN_WAREHOUSE: ${{ github.event.inputs.clean_warehouse }}
    steps:
      - name: 📥 Kết nối kho bãi
        uses: actions/checkout@v4

      - name: 🛠️ Cài đặt Máy móc (ipsw)
        run: |
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install --formula blacktop/tap/ipsw
          ipsw version

      - name: 📦 Tiếp nhận và Giải phẫu IPA
        run: |
          curl -fL -A "Mozilla/5.0" "$IPA_URL" -o app.ipa
          unzip -q app.ipa -d app_extracted

      - name: ⚡ Vận hành dây chuyền Dump
        run: |
          TARGET_DIR="headers/$APP_NAME"
          RAW_CACHE="raw_dump_cache"

          # 🧨 Công tắc dọn kho (chạy trước khi nhập hàng mới)
          if [ "$CLEAN_WAREHOUSE" == "true" ]; then
            echo "🧨 Dọn sạch kho cũ..."
            rm -rf "$TARGET_DIR"
          fi
          mkdir -p "$TARGET_DIR" "$RAW_CACHE"

          echo "🧬 Đang quét Mach-O và băm nát Binary..."
          find app_extracted/Payload -type f \
            ! -name "*.*" ! -name "CodeResources" ! -name "PkgInfo" > bin_list.txt

          while IFS= read -r BIN; do
            if file "$BIN" | grep -q "Mach-O"; then
              echo "🏗️ Đang xử lý: $(basename "$BIN")"
              ipsw class-dump "$BIN" --headers -o "$RAW_CACHE" || true
            fi
          done < bin_list.txt

          echo "📊 Header thô thu được: $(find "$RAW_CACHE" -type f -name '*.h' | wc -l)"

          # --- QUY TRÌNH PHÂN PHỐI HÀNG HOÁ ---
          if [ -z "$TARGET_CLASSES" ]; then
            echo "🚜 Chế độ: DUMP ALL (Hốt trọn ổ)"
            find "$RAW_CACHE" -type f -name "*.h" -exec cp -f {} "$TARGET_DIR/" \;
          else
            echo "🧺 Chế độ: NHẶT TINH NHUỆ (Theo danh sách)"
            for CLS in $TARGET_CLASSES; do
              [ -z "$CLS" ] && continue
              find "$RAW_CACHE" -type f -iname "*$CLS*.h" -exec cp -f {} "$TARGET_DIR/" \;
            done
          fi

          echo "📦 Kho hiện có $(ls "$TARGET_DIR" | wc -l) linh kiện."

      - name: 🧼 Thanh tẩy kho bãi (Bộ lọc an toàn)
        if: github.event.inputs.skip_filtering == 'false'
        run: |
          TARGET_DIR="headers/$APP_NAME"
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            echo "🧹 Đang lọc bỏ rác thải công nghiệp..."

            # 1. Xoá file thực sự rỗng (dưới 30 bytes)
            find . -name "*.h" -type f -size -30c -delete

            # 2. Xoá file rác Swift hệ thống (_Ttc), giữ lại hàng YT/SPT
            find . -name "_Ttc*" ! -name "*YT*" ! -name "*SPT*" -delete

            # 3. Xoá file Metadata rác của ipsw
            rm -f ./*.metadata.h 2>/dev/null || true

            echo "✅ Thanh lọc xong. Kho hiện có $(ls | wc -l) linh kiện chuẩn."
            cd - > /dev/null
          fi

      - name: 🧹 Khử trùng Headers (Loại bỏ Include chéo)
        run: |
          TARGET_DIR="headers/$APP_NAME"
          if [ -d "$TARGET_DIR" ]; then
            echo "🧼 Đang quét sạch các lệnh include nội bộ..."
            # Xoá #include "..." và #import "..."; giữ lại import hệ thống dạng <...>
            find "$TARGET_DIR" -type f -name "*.h" -exec \
              sed -i '' -e '/#include "/d' -e '/#import "/{/<.*>/!d;}' {} +
          fi

      - name: 🩹 Vá giáp (Patch Forward Declaration)
        if: github.event.inputs.apply_patch == 'true'
        run: |
          TARGET_DIR="headers/$APP_NAME"
          if [ -d "$TARGET_DIR" ]; then
            echo "🩹 Đang vá lỗi @class cho linh kiện..."
            PATCH='@class NSObject, NSString, NSArray, NSDictionary, UIView, UIViewController;
          @protocol NSObject, NSCopying, NSCoding;'
            find "$TARGET_DIR" -type f -name "*.h" -print0 | while IFS= read -r -d '' f; do
              { printf '%s\n' "$PATCH"; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
            done
          fi

      - name: 🚀 Cất hàng vào kho bãi repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add headers/
          git commit -m "🚀 Factory Update: $APP_NAME [v3.1]" || { echo "Không có thay đổi để commit."; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
